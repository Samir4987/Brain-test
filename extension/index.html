<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Brain Test: 100+ Levels</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 700;
            color: #4b5563;
        }

        .level-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
        }

        .lives {
            color: var(--danger);
            font-size: 1.2rem;
        }

        /* Question & Target Area */
        .question-box {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 30px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.4;
        }

        .interactive-zone {
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Options layout */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }

        .btn:hover {
            border-color: var(--primary);
            background: #f5f3ff;
        }

        /* Grid specific patterns */
        .pattern-grid {
            display: grid;
            gap: 8px;
            margin: 0 auto;
        }

        .tile {
            background-color: #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            aspect-ratio: 1;
            transition: background-color 0.2s ease, transform 0.1s;
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile.active {
            background-color: var(--primary);
        }

        .tile.correct {
            background-color: var(--success);
        }

        .tile.wrong {
            background-color: var(--danger);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 1%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Screens */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .hero-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .test-controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            background: #e5e7eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameWindow">
        
        <!-- START SCREEN -->
        <div id="startScreen" class="screen active">
            <h1 class="hero-title">Brain Age Test</h1>
            <p style="color: #6b7280; margin-bottom: 30px;">100+ procedural levels of logic, math, memory, and perception puzzles.</p>
            <button class="btn" style="width: 100%; background: var(--primary); color: white;" onclick="startGame()">Start Test</button>
        </div>

        <!-- GAMEPLAY SCREEN -->
        <div id="gameplayScreen" class="screen">
            <div class="stats-bar">
                <span class="level-badge" id="levelDisplay">Level 1/100</span>
                <span class="lives" id="livesDisplay">❤️❤️❤️</span>
            </div>
            
            <div class="question-box" id="questionText">
                Question will appear here...
            </div>

            <div class="interactive-zone" id="gameZone">
                <!-- Content injected programmatically -->
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="test-controls">
                <button class="btn-small" onclick="jumpToLevel(25)">Level 25</button>
                <button class="btn-small" onclick="jumpToLevel(50)">Level 50</button>
                <button class="btn-small" onclick="jumpToLevel(75)">Level 75</button>
                <button class="btn-small" onclick="jumpToLevel(100)">Level 100</button>
            </div>
        </div>

        <!-- GAMEOVER SCREEN -->
        <div id="gameoverScreen" class="screen">
            <h1 class="hero-title" style="color: var(--danger);">Test Failed!</h1>
            <p id="failAnalysis" style="margin-bottom: 30px;">Your brain overloaded at Level 1.</p>
            <button class="btn" style="width: 100%; background: var(--primary); color: white;" onclick="resetToStart()">Try Again</button>
        </div>

        <!-- WIN SCREEN -->
        <div id="winScreen" class="screen">
            <h1 class="hero-title" style="color: var(--success);">Incredible!</h1>
            <p style="margin-bottom: 10px; font-weight: bold;">You completed the entire Brain Test program!</p>
            <p style="color: #6b7280; margin-bottom: 30px;">Calculated Brain Age: <span style="color: var(--primary); font-size: 1.5rem;" id="finalBrainAge">20</span></p>
            <button class="btn" style="width: 100%; background: var(--primary); color: white;" onclick="resetToStart()">Play Again</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
